<title>Generatore Password Diceware</title>
<style>
  :root {
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }

    margin: 0;

    font-size: 0.9rem;
    margin-bottom: 0.4rem;
  }

    width: 100%;

    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    font-size: 1.08rem;
    letter-spacing: 0.02em;
    color: #171a21;
    background: #f8f9fc;
    border: 1px solid #c9cfda;
    border-radius: 10px;
    outline-offset: 2px;
  }
  input[type="text"]:focus-visible {
    outline: 3px solid #2c6ef2;
    border-color: #2c6ef2;
  }
  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.65rem;
    margin-top: 1.1rem;
  }
  button {
    flex: 1 1 10rem;
    padding: 0.8rem 1.1rem;
    font-size: 1rem;
    font-weight: 600;
    font-family: inherit;
    border-radius: 10px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.05s ease;
  }
  button:active { transform: translateY(1px); }
  button:focus-visible {
    outline: 3px solid #2c6ef2;
    outline-offset: 2px;
  }

    background: #2c6ef2;
    color: #ffffff;
  }

    color: #1f2b45;
    border-color: #c9cfda;
  }
  #copy:hover { background: #f1f4fa; }

    margin: 0.9rem 0 0;
    min-height: 1.4em;
    font-size: 0.9rem;

  }

    main { padding: 1.25rem; border-radius: 12px; }
    h1 { font-size: 1.2rem; }
    input[type="text"] { font-size: 1rem; }
    .radio-group { gap: 0.75rem 1.25rem; }

<body>
<main>
  <h1>Generatore Password Diceware</h1>
  <p class="hint">Scegli il numero di parole, poi genera la password.</p>

  <fieldset>
    <legend>Numero di parole</legend>
    <div class="radio-group">
      <label>
        <input type="radio" name="wordCount" value="4">
        4 parole
      </label>
      <label>
        <input type="radio" name="wordCount" value="5">
        5 parole
      </label>
      <label>
        <input type="radio" name="wordCount" value="6" checked>
        6 parole
      </label>
    </div>
  </fieldset>

  <label for="password">La tua password</label>
  <input id="password" type="text" readonly spellcheck="false" autocomplete="off" aria-describedby="status">

  <div class="actions">
    <button id="generate" type="button">Genera</button>
    <button id="copy" type="button">Copia</button>
  </div>

  <p id="status" role="status" aria-live="polite"></p>
</main>

  /* ------------------------------------------------------------------
     Preparazione della lista
     ------------------------------------------------------------------ */
  var WORDS = Array.from(new Set(
    WORDLIST_RAW
      .split(/\r?\n/)
      .map(function (w) { return w.trim().toLowerCase(); })
      .filter(function (w) { return w.length > 0 && w.charAt(0) !== '#'; })
  ));

  var DEFAULT_WORD_COUNT = 6;

  /* ------------------------------------------------------------------
     Riferimenti DOM
     ------------------------------------------------------------------ */
  var pwdEl = document.getElementById('password');
  var genBtn = document.getElementById('generate');
  var copyBtn = document.getElementById('copy');
  var statusEl = document.getElementById('status');
  var radioButtons = document.querySelectorAll('input[name="wordCount"]');

  function setStatus(message, isError) {
    statusEl.textContent = message;
    statusEl.classList.toggle('error', !!isError);
  }

  function getSelectedWordCount() {
    for (var i = 0; i < radioButtons.length; i++) {
      if (radioButtons[i].checked) {
        return parseInt(radioButtons[i].value, 10);
      }
    }
    return DEFAULT_WORD_COUNT;
  }

  /* ------------------------------------------------------------------
     Casualità uniforme con crypto.getRandomValues()
     (rejection sampling per evitare il bias del modulo)
     ------------------------------------------------------------------ */
  function hasCrypto() {
    return typeof crypto !== 'undefined' &&
           typeof crypto.getRandomValues === 'function';
  }

  function randomInt(max) {
    var RANGE = 4294967296; // 2^32
    var limit = Math.floor(RANGE / max) * max;
    var buffer = new Uint32Array(1);
    var value;
    do {
      crypto.getRandomValues(buffer);
      value = buffer[0];
    } while (value >= limit);
    return value % max;
  }

  function capitalize(word) {
    return word.charAt(0).toUpperCase() + word.slice(1);
  }

  /* ------------------------------------------------------------------
     Generazione
     ------------------------------------------------------------------ */
  function generate() {
    var wordCount = getSelectedWordCount();

    if (!hasCrypto()) {
      pwdEl.value = '';
      setStatus('Errore: il browser non supporta crypto.getRandomValues().', true);
      return;
    }

    if (WORDS.length < wordCount) {
      pwdEl.value = '';
      setStatus('Errore: la lista di parole contiene meno di ' + wordCount +
                ' parole valide (trovate: ' + WORDS.length + ').', true);
      return;
    }

    var parts = [];
    for (var i = 0; i < wordCount; i++) {
      parts.push(capitalize(WORDS[randomInt(WORDS.length)]));
    }

    pwdEl.value = parts.join('');
    setStatus('Password generata con ' + wordCount + ' parole casuali.');
  }

  /* ------------------------------------------------------------------
     Copia negli appunti (con fallback per file:// e browser datati)
     ------------------------------------------------------------------ */
  function fallbackCopy() {
    var copied = false;
    try {
      pwdEl.focus();
      pwdEl.select();
      pwdEl.setSelectionRange(0, pwdEl.value.length);
      copied = document.execCommand('copy');
      pwdEl.setSelectionRange(0, 0);
      pwdEl.blur();
    } catch (e) {
      copied = false;
    }
    return copied;
  }

  function copyPassword() {
    var value = pwdEl.value;

    if (!value) {
      setStatus('Genera prima una password.', true);
      return;
    }

    function done(ok) {
      if (ok) {
        setStatus('Password copiata negli appunti.');
      } else {
        setStatus('Impossibile copiare automaticamente: seleziona il testo e copia manualmente.', true);
      }
    }

    if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
      navigator.clipboard.writeText(value).then(
        function () { done(true); },
        function () { done(fallbackCopy()); }
      );
    } else {
      done(fallbackCopy());
    }
  }

  /* ------------------------------------------------------------------
     Avvio
     ------------------------------------------------------------------ */
  genBtn.addEventListener('click', generate);
  copyBtn.addEventListener('click', copyPassword);

  // Rigenera automaticamente quando cambia la scelta del numero di parole
  for (var i = 0; i < radioButtons.length; i++) {
    radioButtons[i].addEventListener('change', generate);
  }

  generate();
})();
